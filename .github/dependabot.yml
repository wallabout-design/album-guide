# Weekly dependency updates, grouped so each ecosystem opens at most one
# minor-and-patch PR a week. CI (`check` and `e2e`) must pass before any merge.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
    # Majors come as separate PRs, since they can need migrations.
    open-pull-requests-limit: 5
    ignore:
      # Types track the Node version CI runs (24), not the latest. Raise both together.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # The shared feedback link (wallabout-design/feedback) is installed from a
      # git tag, and we bump that tag by hand when we choose to
      # (standards/feedback.md in wallabout-design/standards). Dependabot also
      # mis-orders its tags: it offered v0.2.0 -> v0.1.0, a downgrade (#12).
      - dependency-name: "@wallabout-design/feedback"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
