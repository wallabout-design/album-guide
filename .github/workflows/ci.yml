name: CI

# Checks every pull request and every push to main. `check` and `e2e` are the
# required checks on main.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The installed Playwright version, which names the container image the
  # browser jobs run in, so the two can never drift apart when Playwright is
  # updated.
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

  # Type check, lint, build, HTML validation and the unit layer.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The steps of `npm run verify` (standards/testing.md in
      # wallabout-design/standards), without the browser tests, which the e2e
      # job runs.
      # Types (tsc -b: the app, the worker and the tests) and oxlint.
      - run: npm run check
      # Built as production builds it, against the production API.
      - run: npm run build:production
      # The Worker configs and code, production and preview, as Workers Builds
      # deploys them (bundles worker/ and reads dist/ without uploading anything).
      - run: npm run check:deploy
      - run: npm run lint:html
      - run: npm run dist-check
      # The unit layer: the render, click and feedback checks, the recommender
      # eval, and the Worker and src/lib unit tests. No server, no browser.
      - run: npm run test:unit

  # Every view in Chromium and WebKit against the production build, with the
  # API and cover art mocked (e2e/network.ts); see playwright.config.ts.
  e2e:
    needs: playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Playwright's own image: the browsers and their system libraries are in it.
    # Installing them on each run (`playwright install --with-deps`) downloads
    # from Ubuntu's mirror, and when that stalled, jobs hung until they timed
    # out (8 of 30 burn-in jobs on 2026-11-10). Tests must not need the network.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Every view at 360, 768, 1024 and 1440px, light and dark, Chromium and
  # WebKit, for reviewing a change visually. Not a required check; it comments
  # on the PR with a link to the artifact.
  screenshots:
    needs: playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Playwright's own image: the browsers and their system libraries are in it.
    # Installing them on each run (`playwright install --with-deps`) downloads
    # from Ubuntu's mirror, and when that stalled, jobs hung until they timed
    # out (8 of 30 burn-in jobs on 2026-11-10). Tests must not need the network.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-noble
      options: --ipc=host
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run screenshots
      - uses: actions/upload-artifact@v7
        id: upload
        with:
          name: screenshots
          path: screenshots/
          retention-days: 14
      # Only on PRs, and not Dependabot's: its token is read-only.
      - if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        uses: actions/github-script@v9
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        with:
          script: |
            const marker = '<!-- screenshots -->';
            const body = `${marker}\nScreenshots of every view (e2e/routes.ts) at 360, 768, 1024 and 1440px, light and dark, in Chromium and WebKit: [download the \`screenshots\` artifact](${process.env.ARTIFACT_URL}) (commit ${context.sha.slice(0, 7)}).`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
